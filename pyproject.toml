[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta_tools"
version = "1.5.0"
description = "Shared tooling for the Rosetta interpretability research program"
authors = [{name = "James Henry", email = "jamesrahenry@henrynet.ca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/jamesrahenry/Rosetta_Tools"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosetta_tools*"]

[tool.setuptools.package-data]
rosetta_tools = ["data/*.yaml"]
