[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta_tools"
version = "1.3.0"
description = "Shared tooling for the Rosetta interpretability research program"
authors = [{name = "James Henry", email = "jamesrahenry@henrynet.ca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
extract = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.26",
    "huggingface_hub>=0.20",
]
quantize = [
    "rosetta_tools[extract]",
    "bitsandbytes>=0.41",
]
tracking = [
    "mlflow>=2.10",
]
all = [
    "rosetta_tools[extract,quantize,tracking]",
]
dev = [
    "rosetta_tools[all]",
    "pytest>=7.0",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/jamesrahenry/Rosetta_Tools"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosetta_tools*"]

[tool.setuptools.package-data]
rosetta_tools = ["data/*.yaml"]
